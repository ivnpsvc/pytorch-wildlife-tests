name: Slow tests

on:
  schedule:
    # Every night at 03:00 UTC
    - cron: "0 3 * * *"
  # Adds a "Run workflow" button on the Actions tab
  workflow_dispatch:

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Cache model weights
        # About 1.3 GB of weights; reused between nightly runs.
        uses: actions/cache@v6
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: model-weights-pytorchwildlife-1.3.0

      - name: Download default model weights
        # Same workaround as in tests.yml (finding F3).
        run: |
          mkdir -p ~/.cache/torch/hub/checkpoints
          test -f ~/.cache/torch/hub/checkpoints/MDV6b-yolov9-c.pt || curl -L -o ~/.cache/torch/hub/checkpoints/MDV6b-yolov9-c.pt "https://zenodo.org/records/15398270/files/MDV6-yolov9-c.pt?download=1"

      - name: Run slow tests
        run: pytest -m slow -v -rxXs

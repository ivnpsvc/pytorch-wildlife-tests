name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Check code style
        run: |
          ruff check .
          ruff format --check .

      - name: Download model weights
        # Workaround: PytorchWildlife 1.3.0 checks the cache for
        # MDV6b-yolov9-c.pt, but downloads MDV6-yolov9-c.pt, so it
        # never finds its own download and downloads again every time.
        run: |
          mkdir -p ~/.cache/torch/hub/checkpoints
          curl -L -o ~/.cache/torch/hub/checkpoints/MDV6b-yolov9-c.pt "https://zenodo.org/records/15398270/files/MDV6-yolov9-c.pt?download=1"

      - name: Run tests
        run: pytest -v
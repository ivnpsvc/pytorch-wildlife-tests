[pytest]
# Skip slow tests by default. Run them with: pytest -m slow
addopts = -m "not slow" --strict-markers
markers =
    slow: large model downloads or long runs; skipped by default, run nightly in CI
filterwarnings =
    # yolov5 (a PytorchWildlife dependency) imports the deprecated
    # pkg_resources module. Not our code; tracked in
    # https://github.com/microsoft/Pytorch-Wildlife/issues/26
    ignore:pkg_resources is deprecated:UserWarning
